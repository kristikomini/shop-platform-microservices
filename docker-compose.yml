# Full microservices platform: gateway + Angular SPA + 2 HTTP services + 1 worker,
# each business service with its OWN database, plus a RabbitMQ broker.
# Services start in dependency order and wait for real readiness via healthchecks.
# Run everything with:  docker compose up --build
services:

  # ---- Public entry point ------------------------------------------------
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"          # the ONLY port exposed to the host
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    depends_on:
      catalog:
        condition: service_healthy
      orders:
        condition: service_healthy
      frontend:
        condition: service_started

  # ---- Angular SPA, served by nginx, behind the gateway ------------------
  frontend:
    build: ./frontend        # no host port: reachable only via the gateway

  # ---- Catalog service + its private database ----------------------------
  catalog:
    build: ./services/catalog
    environment:
      ConnectionStrings__CatalogDb: "Host=catalog-db;Database=catalog;Username=app;Password=pass"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    depends_on:
      catalog-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  catalog-db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: catalog
    volumes:
      - catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d catalog"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---- Orders service + its SEPARATE database ----------------------------
  orders:
    build: ./services/orders
    environment:
      ConnectionStrings__OrdersDb: "Host=orders-db;Database=orders;Username=app;Password=pass"
      Services__Catalog: "http://catalog:8080"   # find Catalog by service name
      RabbitMq__Host: "rabbitmq"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    depends_on:
      orders-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  orders-db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: orders
    volumes:
      - orders-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d orders"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---- Shipping worker: no API, no DB, only consumes events --------------
  shipping:
    build: ./services/shipping
    environment:
      RabbitMq__Host: "rabbitmq"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ---- Distributed tracing backend + UI ----------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"        # Jaeger UI at http://localhost:16686

  # ---- Metrics: Prometheus scrapes each service's /metrics ---------------
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"          # Prometheus UI at http://localhost:9090
    depends_on:
      - catalog
      - orders
      - shipping

  # ---- Dashboards: Grafana, auto-provisioned with the datasource + board --
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"          # Grafana at http://localhost:3000
    depends_on:
      - prometheus

  # ---- Message broker ----------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"        # management UI at http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  catalog-data:
  orders-data:
