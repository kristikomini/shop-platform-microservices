server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path returns index.html so Angular can route it.
    # (API paths /catalog/* and /orders/* never reach here — the gateway routes
    # them to the backend services before they get to this container.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
