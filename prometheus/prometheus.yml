global:
  scrape_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: catalog
    static_configs:
      - targets: ['catalog:8080']
  - job_name: orders
    static_configs:
      - targets: ['orders:8080']
  - job_name: shipping
    static_configs:
      - targets: ['shipping:8080']
  - job_name: auth
    static_configs:
      - targets: ['auth:8080']
